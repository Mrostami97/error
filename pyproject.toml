[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-pdf-question-extractor"
version = "0.1.0"
description = "Extract multiple-choice exam questions from text-based PDFs into structured JSON."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammad Rostami" }]
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exam-pdf-extract = "exam_pdf_question_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
