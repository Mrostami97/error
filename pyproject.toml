[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-pdf-question-extractor"
version = "0.1.0"
description = "Extract multiple-choice exam questions from text-based PDFs into structured, auditable JSON."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohammad Rostami" }]
keywords = ["pdf", "exam", "question-extraction", "education", "json"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing",
]
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
exam-pdf-extract = "exam_pdf_question_extractor.cli:main"

[project.urls]
Homepage = "https://github.com/Mrostami97/exam-pdf-question-extractor"
Repository = "https://github.com/Mrostami97/exam-pdf-question-extractor"
Issues = "https://github.com/Mrostami97/exam-pdf-question-extractor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
